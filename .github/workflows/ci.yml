name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  GO_VERSION: "1.24"
  NODE_VERSION: "20"
  GOLANGCI_LINT_VERSION: v1.64.8
  SQLC_VERSION: v1.31.1
  GOVULNCHECK_VERSION: v1.1.3

jobs:
  backend:
    runs-on: ubuntu-latest
    # Integration tests run against a real PostgreSQL (RLS end-to-end).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tirek_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TIREK_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tirek_test?sslmode=disable
      TIREK_TEST_APP_DATABASE_URL: postgres://tirek_app:tirek_app@localhost:5432/tirek_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: Generate SQL code (sqlc)
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@${{ env.SQLC_VERSION }}
          sqlc generate
          git diff --exit-code -- internal/platform/db/gen/
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: backend
      - name: Unit tests
        run: go test -count=1 $(go list ./... | grep -v /internal/integration)
      - name: Integration tests (RLS end-to-end against PostgreSQL service)
        run: go test -race -count=1 ./internal/integration/
      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          govulncheck ./...
      - name: Build image
        run: |
          docker build -t tirek-api:ci .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: tirek-api:ci
          severity: HIGH,CRITICAL
          exit-code: "1"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
